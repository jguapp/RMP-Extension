<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RMP for CUNYfirst</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img class="header__icon" src="../../icons/icon-48.png" alt="" width="22" height="22">
    <h1 class="header__title">RMP for CUNYfirst</h1>
  </header>

  <main>
    <section class="section">
      <label class="row" for="enabled">
        <span class="row__title">Show ratings</span>
        <input type="checkbox" id="enabled" class="switch">
      </label>
      <label class="row" for="hoverCards">
        <span class="row__title">Hover preview</span>
        <input type="checkbox" id="hoverCards" class="switch">
      </label>
    </section>

    <section class="section" id="siteSection" hidden>
      <p class="site" id="siteOrigin"></p>
      <button type="button" id="siteToggle" class="button" hidden></button>
    </section>

    <section class="section">
      <label class="row" for="autoDetect">
        <span class="row__title">Detect campus</span>
        <input type="checkbox" id="autoDetect" class="switch">
      </label>
      <select id="manualSchoolKey" class="select" aria-label="Campus"></select>
    </section>

    <section class="section section--split">
      <label class="chip" for="showDifficulty">
        <input type="checkbox" id="showDifficulty" class="switch switch--sm">
        <span>Difficulty</span>
      </label>
      <label class="chip" for="showWouldTakeAgain">
        <input type="checkbox" id="showWouldTakeAgain" class="switch switch--sm">
        <span>Retake&nbsp;%</span>
      </label>
    </section>

    <section class="section section--split">
      <span class="muted" id="cacheStats">&nbsp;</span>
      <button type="button" id="clearCache" class="button button--link">Clear cache</button>
    </section>
  </main>

  <script src="../lib/namespace.js"></script>
  <script src="../lib/schools.js"></script>
  <script src="popup.js"></script>
</body>
</html>
