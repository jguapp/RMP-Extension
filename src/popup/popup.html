<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RMP for CUNYfirst</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img class="header__icon" src="../../icons/icon-48.png" alt="" width="28" height="28">
    <div>
      <h1 class="header__title">RMP for CUNYfirst</h1>
      <p class="header__subtitle">Ratings inside Schedule Builder</p>
    </div>
  </header>

  <main>
    <section class="section">
      <label class="row row--toggle" for="enabled">
        <span class="row__label">
          <span class="row__title">Show ratings</span>
          <span class="row__hint">Annotate instructor names on CUNYfirst pages</span>
        </span>
        <input type="checkbox" id="enabled" class="switch">
      </label>

      <label class="row row--toggle" for="hoverCards">
        <span class="row__label">
          <span class="row__title">Hover preview</span>
          <span class="row__hint">Score breakdown card on hover</span>
        </span>
        <input type="checkbox" id="hoverCards" class="switch">
      </label>
    </section>

    <section class="section">
      <h2 class="section__title">Campus</h2>
      <label class="row row--toggle" for="autoDetect">
        <span class="row__label">
          <span class="row__title">Detect automatically</span>
          <span class="row__hint">Read the college from the page</span>
        </span>
        <input type="checkbox" id="autoDetect" class="switch">
      </label>

      <label class="row row--stack" for="manualSchoolKey">
        <span class="row__title" id="schoolLabel">Fall back to</span>
        <select id="manualSchoolKey" class="select" aria-labelledby="schoolLabel"></select>
      </label>
      <p class="note">Used when detection fails, or always when automatic detection is off.</p>
    </section>

    <section class="section">
      <h2 class="section__title">Hover card details</h2>
      <label class="row row--toggle" for="showDifficulty">
        <span class="row__title">Average difficulty</span>
        <input type="checkbox" id="showDifficulty" class="switch">
      </label>
      <label class="row row--toggle" for="showWouldTakeAgain">
        <span class="row__title">Would take again</span>
        <input type="checkbox" id="showWouldTakeAgain" class="switch">
      </label>
    </section>

    <section class="section">
      <h2 class="section__title">Cache</h2>
      <p class="note" id="cacheStats">Loading…</p>
      <button type="button" id="clearCache" class="button">Clear cached ratings</button>
    </section>
  </main>

  <footer class="footer">
    <p>Ratings come from Rate My Professors. This extension is not affiliated with
      CUNY or Rate My Professors.</p>
  </footer>

  <script src="../lib/namespace.js"></script>
  <script src="../lib/schools.js"></script>
  <script src="popup.js"></script>
</body>
</html>
